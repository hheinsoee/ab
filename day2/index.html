<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2 — Color Changer</title>

    <!-- CSS file ကို ဒီမှာ link လုပ်တယ် -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- id="heading" — JS က ဒီ id နဲ့ ရှာမယ် -->
    <h1 id="heading">Hello, builders!</h1>

    <!-- id="colorBtn" — JS က ဒီ button ကို နားထောင်မယ် -->
    <button id="colorBtn">Change color</button>

    <!-- JS file ကို body အောက်ဆုံးမှာ ထည့် -->
    <script src="script.js"></script>
</body>

</html>
